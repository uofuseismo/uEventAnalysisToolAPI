edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

/**
 * User login request with an ed25519 public key.
 */
message LoginWithKeyRequest {
   // The user's PUBLIC key.  This should be length 32U. 
   bytes public_key = 1;
   // A fresh signature made with the public key.
   bytes signature = 2;
   // The signed message.
   bytes signed_message = 3;    
   // The length of the unsigned message. 
   uint32 signed_message_length = 4;
   // The frontend version.
   string version = 5;
}

